# ============================================================
#  Настройки NePridymal. Меняй числа, сохраняй файл и перезапускай игру.
#  Удалил строку — вернётся значение по умолчанию (оно и записано здесь).
#  Опечатка в файле — игра не упадёт, а возьмёт значения по умолчанию и напишет об этом в окне.
#
#  «Возврат игроку» (edge): 0.96 = на дистанции игрокам возвращается 96% ставок, казино берёт 4%.
#  Больше 1.0 — казино начинает раздавать звёзды (игроки будут в плюсе на дистанции). Не ставь ≥ 1.
#  Шансы игр можно менять и прямо в игре: Админка → «Шансы» (действует сразу, важнее этого файла).
# ============================================================

[start]
start_stars = 5000          # звёзд новому игроку (при вайпе своя настройка в wipecfg, тоже 5000)
ref_bonus = 5000            # за приглашённого друга
free_case_hours = 6.0       # бесплатный кейс раз в N часов
daily_hours = 20.0          # бонус дня раз в N часов
daily_scale = 0.6           # множитель бонуса дня

[games]
edge = 0.97                 # кубик, лимбо, башня — возврат игроку
crash_edge = 0.97           # краш
mines_edge = 0.97           # мины
chicken_edge = 0.97         # курица
hilo_edge = 0.97            # больше/меньше
upgrade_edge = 0.94         # апгрейд: шанс = ставка / цель × это число
upgrade_max = 0.8           # апгрейд: максимальный шанс (80%)
slots_rtp = 0.93            # слоты (было 0.94 — урезали 11.10.2026)
avia_rtp = 0.97             # самолётик
wheel_rtp = 0.945           # колесо фортуны (множители секторов масштабируются)
scratch_rtp = 0.95          # скретч-карты
claw_rtp = 0.96             # кран (автомат с клешнёй): шанс удержать приз = это число / множитель
pump_rtp = 0.97             # насос: шар лопается всё чаще, множитель оплачивает риск
plinko_rtp = 0.97           # плинко: множители лунок масштабируются под это число
drill_rtp = 0.97            # бур: множители пластов масштабируются под это число
darts_rtp = 0.97            # дартс: множители зон масштабируются под это число
fish_rtp = 0.97             # рыбалка (одиночный краш): P(дотянуть до x) = это число / x
keno_rtp = 0.97             # кено: таблицы выплат масштабируются под это число
penalty_rtp = 0.97          # пенальти: множитель после n голов = это число / P(гол)^n
dogs_scale = 0.40          # пёсики: множитель выплат (возврат ≈ число × 2,43: 0.405 ≈ 98,4%; 0.395 ≈ 96%). Не выше 0.41!
carousel_rtp = 0.97         # карусель: возврат игроку
carousel_max = 200000       # карусель: максимум ставок игрока на раунд
ladder_rtp = 0.97           # лестница: возврат игроку
safe_rtp = 0.97             # сейф: возврат игроку, включая 2% общего фонда
bankbet_rake = 0.08         # ставка на банк: комиссия банка с выигрыша
bankbet_max = 100000        # ставка на банк: максимум на раунд
forecast_rake = 0.08        # прогноз дня: комиссия банка с выигрыша
forecast_max = 100000       # прогноз дня: максимум на один рынок
max_bet = 1000000           # максимальная ставка в играх

[economy]
case_rtp = 0.90             # кейсы: средний возврат (цена кейса считается от этого)
sell_rate = 0.82            # продажа подарка казино: доля от ценности
market_fee = 0.06           # комиссия маркета
trade_fee = 0.06            # комиссия со звёзд в обменах
transfer_fee = 0.05         # «Кошелёк»: комиссия перевода по QR (платит отправитель сверху суммы)
transfer_min = 10           # минимальный перевод
transfer_day_count = 50     # переводов в сутки с одного аккаунта
transfer_max = 0            # максимум за один перевод (0 — без ограничения)
# все настройки переводов можно менять на лету: Админка → вкладка «Переводы»
duel_fee = 0.05             # комиссия дуэлей
income_tax = 0.08           # налог с пассивного дохода
gift_income = 0.003          # доход подарков: доля ценности в сутки
lucky_chance = 0.003        # «удачный момент»: шанс сюрприза после раунда (не чаще раза в сутки)
bigwin_min = 3000           # с какой суммы выигрыш попадает в ленту крупных выигрышей
bigwin_fee = 0.01           # сбор банка с выигрышей от bigwin_fee_min
bigwin_fee_min = 10000
reward_scale = 0.85          # множитель наград за задания и уровни
biz_margin = 0.24           # бизнесы: базовая наценка партии (умножается на спрос, цепочку и курс банка)
biz_batch_small = 0.25      # размер партии на 1 уровне как доля цены: бизнесы дешевле 100 000
biz_batch_mid = 0.15        # от 100 000 до 1 000 000
biz_batch_big = 0.10        # от 1 000 000 до 5 000 000
biz_batch_huge = 0.07       # от 5 000 000
biz_scale = 0.6            # множитель дохода всех бизнесов (1 — как до обновления)
biz_sell = 0.45             # продажа бизнеса: доля вложенного
stake_scale = 0.1          # множитель доходности стейкинга
vault_1d = 0.003            # сейф подарка: доход за 1 день
vault_3d = 0.01             # за 3 дня
vault_7d = 0.03             # за 7 дней
crypto_fee = 0.004          # комиссия биржи с каждой сделки
swap_fee = 0.005            # обмен монета → монета
fut_fee = 0.002             # фьючерсы: от объёма при открытии и при закрытии

[jackpot]
ticket = 100                # цена билета розыгрыша банка
house_share = 0.10          # доля дневной прибыли казино в фонд розыгрыша
split = [0.60, 0.25, 0.15]  # доли призов за 1, 2, 3 место
free_cap = 50               # максимум бесплатных билетов за игру в день

[cashback]
rate = 0.04                 # кэшбэк недели: доля чистого проигрыша
min_loss = 2000             # с какого минуса за неделю платим
max = 250000                # потолок кэшбэка на игрока

[comeback]
case = "starter"            # ключ от какого кейса дарим вернувшимся (id кейса)

[clans]
create_cost = 5000          # цена создания клана
war_prizes = [10000, 5000, 2000]   # призы битвы кланов за 1–3 место
level_bonus = 0.02          # +доход за каждый уровень клана

[shop]
rate = 1000                 # игровых звёзд за 1 Telegram Star
first_bonus = 1.0           # бонус первой покупки (+100%)
first_cap = 250000          # но не больше стольких звёзд

[tourn]
pool = 15000                # призовой фонд турнира недели

[gameday]
pool = 10000                # игра дня: потолок фонда (до поправки на курс банка)
pool_pct = 0.025            # фонд: доля от суммы исходов за день; держать меньше 0,031 (потеря игрока при возврате 94%), иначе накрутка твинками выгодна
min_pts = 50                # меньше очков приза нет

[season]
prizes = [40000, 20000, 12000, 6000, 6000, 4000, 4000, 2000, 2000, 2000]   # призы сезона, места 1–10

[loans]
ltv = 0.4                   # кредит под залог: доля ценности подарка
fee = 0.15                  # базовая ставка; лимит и ставка зависят от рейтинга, таблица в server/loans.py
score_ok = 40               # рейтинг за возврат в срок
score_lost = 150            # рейтинг минус за просрочку
bank_share = 0.05           # без залога одному игроку: не больше этой доли банка
biz_ltv = 0.8               # кредит под бизнес: доля цены продажи (должна быть меньше 1)
auto_share = 0.3            # часть собранного дохода, которая гасит кредит под бизнес
lost_fee = 0.05             # штраф за просрочку кредита без залога
penalty_hours = 48          # после просрочки: столько часов без новых кредитов
penalty_bet = 10000         # и потолок ставки

[franchise]
# Свой бот игрока с этой же игрой (/franchise в боте). База и аккаунты общие.
reward = 25000              # ⭐ владельцу бота — один раз на аккаунт…
reward_players = 10         # …когда через его бота придут столько новых игроков…
reward_level = 5            # …и дорастут до этого уровня (против твинков)
max_per_owner = 5           # ботов на одного игрока (сверх — не подключаются)
max_age_hours = 24          # сколько часов действует вход из бота-франшизы (у главного — 7 дней)

[bank]
crisis_at = 35000000          # банк ниже — кризис: ставки ограничены, дивиденды на паузе
crisis_max_bet = 100000       # потолок ставки в кризис
savior_min = 10000            # столько подарить банку в кризис — титул «Спаситель банка»
level1_at = 50000000          # уровень банка 1 — при таком размере
level2_at = 100000000         # уровень 2
level3_at = 250000000         # уровень 3
deposit_bonus = 0.25          # +к доходности вкладов за каждый уровень банка (+25%)

backing = 0.25                # доля купленных звёзд, добавляемая к банку как обеспечение
faucet_low = 0.6              # если за 7 дней банк в минусе — бонусы и пассивный доход умножаются на это число

[deposit]
# Вклады в банк: звёзды заморожены (банк растёт), проценты капают непрерывно, выплата в конце срока.
# Досрочное изъятие: тело минус комиссия, проценты сгорают. В кризис вклады закрыты.
min = 1000                    # минимальный вклад
max_total = 500000            # сумма всех вкладов игрока
rate1 = 0.001                 # доходность за 1 день (0,2%)
rate3 = 0.003                 # за 3 дня (0,8%)
rate7 = 0.01                 # за 7 дней (2,5%)
early_fee = 0.02              # комиссия за досрочное изъятие (2% тела)

[idletax]
# Сбор за простой (server/idletax.py): кто не заходил idle_days и держит больше floor, раз в неделю отдаёт банку rate с суммы сверх floor
on = true
floor = 5000000
rate = 0.01
idle_days = 14


[pwr]
prices_on = true            # цены скинов CS тянутся с market.csgo.com, шансы кейсов пересчитываются под них (server/csprices.py)
prices_min = 15             # как часто, минут
prices_keep_hours = 24      # скина нет на площадке дольше — убирается из кейсов
# Слияние SKINBOX и тир-кейсов с единой валютой ⭐ (1 XTR = shop.rate ⭐)
usd_coins = 80000           # ⭐ за $1 цены скина: 80 XTR за $1, как в оригинальном SKINBOX (там 20 000 коинов при 250 коинах за XTR)
tier_free_hours = 6.0       # бесплатный тир-кейс: раз в столько часов
tier_max_price = 100000     # тир-кейсы дороже этой цены скрыты (0 — показывать все)
sub_reward = 400            # награда за подписку на канал
ad_rewards = [50, 50, 75, 100, 75]   # награда за 1-й…5-й рекламный ролик в день (с пропуском ×1,5)

[withdraw]
# Вывод скинов CS в Steam через market.csgo.com. Ключ площадки — переменная окружения MARKET_KEY; без неё вывод выключен.
on = true
xtr_usd = 0.011             # сколько $ приносит 1 Telegram Star после всех комиссий. По расчёту ≈ 0,013; пока нет своей статистики — осторожные 0,011
limit_k = 0.7               # игрок выводит скинов не больше 70% от оплаченного (XTR × xtr_usd × это число): маржа с каждого не ниже 30%
hold_hours = 24             # свежая оплата идёт в лимит вывода только через столько часов (защита от возвратов платежей)
price_cap = 1.15            # не покупать скин на вывод, если на площадке он дороже своей ценности в игре больше чем в столько раз
free_user_usd = 1.0         # столько $ игрок может вывести без единого пополнения (за всё время); 0 — вывод только после покупки
free_day_usd = 10.0         # общий бюджет выводов без пополнения на всех игроков за сутки, $
announce = true             # писать в описании бота и приветствии, что скины выводятся в Steam, даже пока ключ площадки (MARKET_KEY) не задан
recheck_hours = 6           # переданный скин перепроверяется раз в столько часов, пока обмен в Steam ещё можно откатить
low_usd = 10.0              # баланс площадки ниже этого (в пересчёте на $) — бот пишет админам
rub_per_usd = 0             # аккаунт площадки в рублях: курс ₽ за $; 0 — брать курс ЦБ автоматически (обновляется раз в час)

[realgifts]
# Все кейсы подарков — с настоящими подарками Telegram (server/realgifts.py). Цена кейса твёрдая, шансы пересчитываются
# от живых цен подарков так, чтобы кейс возвращал призами rtp своей цены. Приз можно продать игре за полную цену или вывести.
on = true
rtp = 0.87                  # средний приз по ценности в ⭐ = 87% цены кейса; призы оценены ×markup, поэтому себестоимость призов — 60% цены
rtp_free = 0.70             # возврат для игроков без единого пополнения (по себестоимости 48% цены); правило написано в окне кейса и в справке
price_k = 1000              # цены кейсов заданы в целых ⭐; в игре звёзды хранятся в тысячных (1 ⭐ = 1 Telegram Star = 1000 единиц)
markup = 1.45               # ценность приза в ⭐ = его цена в Telegram Stars × 1,45 (подарок за 15 Stars — 22 ⭐, за 100 — 145 ⭐)
refresh_min = 10            # как часто обновлять цены подарков
max_age_min = 40            # цена старше — приз убирается из кейсов
slip = 1.15                 # на выводе подарок может стоить не больше цены выигрыша × 1,15, иначе отказ (приз остаётся в сумке)
nft_mode = "auto"           # коллекционные: auto — покупает сервер на Tonnel, а без сессии площадки заявка уходит админу; manual — всегда админ; off — выключены
stars = [15, 100]           # обычные подарки в кейсах: цена в Telegram Stars, от и до
max_usd = 600.0             # коллекционные дороже в кейсы не кладём
k_fill = 1.5                # дешёвые кейсы: вес подарков между собой = (1 / цена)^k
fill = [[0.1, 47.0], [0.3, 29.0], [0.6, 14.0], [1.2, 8.0], [3.0, 2.0]]   # призы звёздами в дешёвых кейсах: [доля цены кейса, вес]; в среднем 37% цены
free_ev = 300               # средний приз бесплатного кейса, в единицах игры (0,3 ⭐)
free_gifts = true           # бесплатный кейс — только подарки, без звёзд (free_ev тогда не действует)
free_over = 1.08            # средний приз бесплатного кейса = самый дешёвый подарок × это число
key_max = 100               # ключ открывает кейс подарков бесплатно только если кейс не дороже стольких ⭐; ключи от дорогих становятся ключами от самого дешёвого
free_friends = 1            # бесплатный кейс: первый прокрут — за подписку на каналы (FREE_CHANNELS), каждый следующий — за столько новых друзей; 0 — без друзей
hide = ["csgo", "csgo2", "brawl", "mc"]   # игровые кейсы без настоящих призов — убраны с витрины

[crypto]
# Пополнение криптой через Crypto Pay (@CryptoBot), нужна переменная окружения CRYPTOPAY_TOKEN.
# С Telegram Stars до нас доходит ≈ 68% денег игрока, с крипты ≈ 97% — поэтому за доллар криптой звёзд больше.
on = true
stars_per_usd = 74000       # базовых ⭐ за $1 (за Stars игрок получает ≈ 52 600 ⭐ на доллар, здесь +40%)
packs = [1.0, 5.0, 10.0, 25.0, 50.0, 100.0]
min_usd = 1.0
max_usd = 500.0
assets = "USDT,TON"

[heist]
# «Ограбление сейфа» (server/heist.py): игрок не заходит — бот пишет, что грабители ломают сейф (1, 2, 3, 5 и 6-й день),
# на burn_days-й день с баланса сгорают все звёзды, кроме купленных. Зашёл раньше — отсчёт заново.
on = true
burn_days = 7
min_loot = 10000            # если на балансе сверх купленного меньше — игрока не трогаем и не пишем

[push]
# Рекламные пуши бота: напоминания, анонсы ивентов, «возвращайся», ежедневные отчёты. Служебные (оплата, вывод, перевод,
# вызов от игрока, поддержка, приз) идут всегда и в лимит не входят. Что не влезло в лимит — остаётся в колокольчике в игре.
on = true
day_max = 2                 # не больше стольких рекламных пушей игроку за сутки (по Москве)
gap_hours = 4               # и не чаще, чем раз в столько часов
